name: build

on:
  push:
    branches: [main, master]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      APP_VERSION: ${{ startsWith(github.ref, 'refs/tags/') && github.ref_name || 'v1.0.0' }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Run tests
        run: python -m unittest discover -s tests -v

      - name: Build onedir runtime
        run: python -m PyInstaller --noconfirm --clean --distpath dist_onedir HeartRateOverlay_onedir.spec

      - name: Build single-file exe
        shell: pwsh
        run: |
          Set-ExecutionPolicy -Scope Process -ExecutionPolicy Bypass -Force
          ./tools/build_single_exe.ps1 `
            -SkipBuild `
            -SourceDir "dist_onedir/HeartRateOverlay" `
            -Output "release/心率悬浮窗.exe"

          ./tools/build_installer.ps1

          $portableHash = (Get-FileHash "release/心率悬浮窗.exe" -Algorithm SHA256).Hash.ToLower()
          $installerHash = (Get-FileHash "release/心率悬浮窗安装程序.exe" -Algorithm SHA256).Hash.ToLower()
          @("$portableHash  心率悬浮窗.exe", "$installerHash  心率悬浮窗安装程序.exe") |
            Set-Content "docs/SHA256SUMS.txt" -Encoding utf8

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: HeartRateOverlay-win64
          path: |
            release/心率悬浮窗.exe
            release/心率悬浮窗安装程序.exe
            docs/SHA256SUMS.txt

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            release/心率悬浮窗.exe
            release/心率悬浮窗安装程序.exe
            docs/SHA256SUMS.txt
          body_path: docs/RELEASE_NOTES.md
          draft: false
          prerelease: false
